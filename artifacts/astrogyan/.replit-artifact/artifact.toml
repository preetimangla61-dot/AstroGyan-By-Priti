kind = "web"
previewPath = "/"
title = "AstroGyan — Booking App"
description = "Astrology consultation booking app for Preeti Mangla (AstroGyan). Clients book one-on-one Vedic astrology readings, pay via UPI, and receive email confirmations. Includes an admin dashboard to manage appointments."
version = "1.0.0"
id = "artifacts/astrogyan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20489

[services.development]
run = "pnpm --filter @workspace/astrogyan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/astrogyan", "run", "build" ]
serve = "static"
publicDir = "artifacts/astrogyan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20489"
BASE_PATH = "/"
